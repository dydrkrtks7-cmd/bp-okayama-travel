<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="911" cy="173" r="21" fill="#16213e" opacity="0.06"/>
    <circle cx="556" cy="11" r="96" fill="#16213e" opacity="0.05"/>
    <circle cx="840" cy="75" r="22" fill="#16213e" opacity="0.20"/>
    <circle cx="1148" cy="616" r="49" fill="#16213e" opacity="0.07"/>
    <circle cx="1094" cy="483" r="92" fill="#16213e" opacity="0.09"/>
    <circle cx="1273" cy="85" r="42" fill="#16213e" opacity="0.18"/>
    <rect x="421" y="168" width="67" height="71" rx="8" fill="#1a1a2e" opacity="0.07" transform="rotate(2, 187, 105)"/>
    <rect x="340" y="464" width="83" height="90" rx="8" fill="#1a1a2e" opacity="0.10" transform="rotate(26, 209, 672)"/>
    <rect x="41" y="436" width="22" height="52" rx="8" fill="#1a1a2e" opacity="0.12" transform="rotate(34, 842, 426)"/>
    <rect x="126" y="722" width="31" height="87" rx="8" fill="#1a1a2e" opacity="0.14" transform="rotate(19, 160, 358)"/>
    <rect x="262" y="-83" width="52" height="78" rx="8" fill="#1a1a2e" opacity="0.07" transform="rotate(11, 131, 676)"/>
    <rect x="764" y="175" width="87" height="85" rx="8" fill="#1a1a2e" opacity="0.08" transform="rotate(27, 949, 728)"/>
    <rect x="279" y="706" width="28" height="97" rx="8" fill="#1a1a2e" opacity="0.05" transform="rotate(29, 399, 185)"/>
    <rect x="704" y="30" width="71" height="21" rx="8" fill="#1a1a2e" opacity="0.08" transform="rotate(9, 116, 542)"/>
    <polygon points="146,518 171,568 121,568" fill="#16213e" opacity="0.10"/>
    <polygon points="665,299 743,455 587,455" fill="#16213e" opacity="0.11"/>
    <polygon points="816,177 856,257 776,257" fill="#16213e" opacity="0.12"/>
    <polygon points="137,95 168,157 106,157" fill="#16213e" opacity="0.07"/>

  <!-- Wave at bottom -->
  <path d="M0,560 C360,595 840,525 1200,560 L1200,630 L0,630Z" fill="#16213e" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    Okayama travel 안내
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    Okayama — 정보
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#e94560" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#e94560" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    Okayama Okayama travel 안내 — 정보
  </text>
</svg>